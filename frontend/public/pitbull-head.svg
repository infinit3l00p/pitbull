<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pitbull head silhouette — geometric/low-poly style -->
  <!-- Ears -->
  <path d="M10 14 L14 6 L18 16 Z" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M38 14 L34 6 L30 16 Z" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Inner ears -->
  <path d="M12 12 L14 9 L16 14 Z" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M36 12 L34 9 L32 14 Z" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Head outline — broad skull, angular jaw -->
  <path d="M24 8
           C18 8, 14 12, 12 18
           L10 24
           C10 30, 14 36, 18 38
           L20 40
           L24 41
           L28 40
           L30 38
           C34 36, 38 30, 38 24
           L36 18
           C34 12, 30 8, 24 8 Z"
        fill="rgba(34,211,238,0.08)"
        stroke="#22d3ee"
        stroke-width="1.4"
        stroke-linejoin="round"/>
  <!-- Brow ridge -->
  <path d="M16 20 Q20 17 24 19 Q28 17 32 20" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Eyes — angular almond shape -->
  <path d="M16 22 L20 23 L18 26 Z" fill="#22d3ee" opacity="0.9"/>
  <path d="M32 22 L28 23 L30 26 Z" fill="#22d3ee" opacity="0.9"/>
  <!-- Eye glow -->
  <circle cx="18.5" cy="24" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <circle cx="29.5" cy="24" r="1.5" fill="#22d3ee" opacity="0.5"/>
  <!-- Muzzle/snout — broad pitbull muzzle -->
  <path d="M19 30 L24 32 L29 30 L28 34 L24 35 L20 34 Z"
        fill="rgba(34,211,238,0.06)"
        stroke="#22d3ee"
        stroke-width="1"
        stroke-linejoin="round"/>
  <!-- Nose -->
  <path d="M22 31 L24 30.5 L26 31 L25 33 L24 33.5 L23 33 Z" fill="#22d3ee" opacity="0.8"/>
  <!-- Mouth/jaw line -->
  <path d="M18 34 Q24 36 30 34" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <!-- Cheek scars — battle marks for attitude -->
  <line x1="13" y1="28" x2="16" y2="30" stroke="#22d3ee" stroke-width="0.6" opacity="0.3"/>
  <line x1="35" y1="28" x2="32" y2="30" stroke="#22d3ee" stroke-width="0.6" opacity="0.3"/>
</svg>